name: Mirror host compilers

# Copies the host compilers listed in host_compiler.sh from their upstream
# release servers into releases of this repository.
# Run it from the Actions tab ("Run workflow"). Versions that are already
# mirrored are skipped unless "force" is ticked.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Download and upload every version again'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: [ host_compiler.sh, mirror.sh ]   # versions or the mirror changed

permissions:
  contents: write   # create releases and upload assets in this repository

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash ./mirror.sh "${{ github.repository }}"
